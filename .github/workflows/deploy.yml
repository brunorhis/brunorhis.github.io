name: Deploy Next.js site to Pages

on:
  # Roda a action sempre que você fizer um push na branch main
  push:
    branches: ["main"]
  # Permite rodar a action manualmente na aba Actions do GitHub
  workflow_dispatch:

# Define as permissões do token (necessário para o deploy no GitHub Pages)
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job responsável por construir o site (npm run build)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
          
      - name: Restaura o cache do Next.js (deixa o build mais rápido)
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
            
      - name: Instala as dependências
        run: npm ci
        
      - name: Compila o projeto (Build)
        run: npm run build
        
      - name: Prepara os arquivos estáticos (Upload artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Job responsável por pegar os arquivos estáticos gerados e publicar no GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
